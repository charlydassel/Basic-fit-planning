<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Crew · Basic-Fit</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b2a86">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Crew">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f5f5;--card:#fff;--tx:#0d0d0d;--mut:#5f5f66;--ac:#5b2a86;--bd:#e4e4e7;--chip:#eee5f6;--chiptx:#5b2a86}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--card:#161616;--tx:#f5f5f5;--mut:#a1a1aa;--ac:#8a4fd8;--bd:#2b2b2b;--chip:#2b1a3d;--chiptx:#c9a7f5}}
:root[data-theme="dark"]{--bg:#0b0b0b;--card:#161616;--tx:#f5f5f5;--mut:#a1a1aa;--ac:#8a4fd8;--bd:#2b2b2b;--chip:#2b1a3d;--chiptx:#c9a7f5}
*{box-sizing:border-box}
html,body{margin:0}
@font-face{font-family:"Anton";src:url(fonts/anton.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:400;src:url(fonts/barlow-condensed-400.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:600;src:url(fonts/barlow-condensed-600.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url(fonts/barlow-condensed-700.woff2) format("woff2");font-display:swap}
body{background:var(--bg);color:var(--tx);font:17px/1.4 "Barlow Condensed",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
#nav button{flex:1;max-width:96px;border:0;background:none;color:var(--mut);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;border-radius:10px}
#nav button i{font-style:normal;font-size:20px}
#nav button.on{color:var(--ac);background:var(--chip);font-weight:600}
.top{padding:2px 0 14px;display:flex;align-items:center;gap:10px}#pgTitle{flex:1;min-width:0;text-align:right;color:var(--mut);font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.05em;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:flex;align-items:center;justify-content:center}.tbtn .ic{width:20px;height:20px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em;cursor:pointer}
.brand svg{width:34px;height:34px}
.hero{text-align:center;padding:20px 0 12px}
.hero svg{width:100px;height:100px;filter:drop-shadow(0 8px 18px rgba(91,42,134,.35))}
.hero h1{font-size:30px;letter-spacing:.1em;margin:14px 0 6px}
.hero p{color:var(--mut);margin:0 auto 6px;max-width:320px}
.hhead{display:flex;align-items:center;gap:12px;padding:4px 0 16px}
.hhead>svg{width:48px;height:48px;flex:none;filter:drop-shadow(0 4px 10px rgba(91,42,134,.3))}
.hht{flex:1;min-width:0;display:flex;flex-direction:column}.hht b{font-size:20px;letter-spacing:.08em}.hht small{color:var(--mut);font-size:13px}
.hacc{flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font-size:14px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.qb{position:relative;display:flex;align-items:center;gap:8px;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;color:var(--tx);font-size:14px;font-weight:600;min-height:56px}
.qb i{font-style:normal;font-size:22px}.qb.on{background:var(--ac);border-color:var(--ac);color:#fff}
.cnt{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:#e0245e;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ban{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.ban span{flex:1}.ban button{border:0;border-radius:8px;padding:6px 10px;background:var(--ac);color:#fff;font-weight:600}.ban .x{background:none;color:var(--mut)}
.here{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:8px 0 4px;border-radius:10px;background:var(--bg);font-size:14px}
.stack{display:flex}.stack .av{border:2px solid var(--card);margin-left:-8px}.stack .av:first-child{margin-left:0}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;display:inline-block}
.ic+span,.ic+b{margin-left:.35em}
.ic.gold{color:#d4a017}.ic.silver{color:#9aa3ad}.ic.bronze{color:#b87333}.ic.star{color:#f5b301;fill:#f5b301}
.dot{display:inline-block;width:.6em;height:.6em;border-radius:50%;vertical-align:.05em;flex:none}.dot.green{background:#22a559}.dot.grey{background:var(--mut);opacity:.5}.dot.red{background:#e0245e}.dot.orange{background:var(--ac)}
.card>b:first-child>.ic,.card b.h>.ic,.day h2 .ic{color:var(--ac)}
.medal .ic{width:30px;height:30px}
#nav button i .ic{width:22px;height:22px}
#nav button i{position:relative}#nav button i.dotted::after{content:"";position:absolute;top:-1px;right:-4px;width:8px;height:8px;border-radius:50%;background:#e0245e;border:2px solid var(--card)}
.tile span .ic{width:28px;height:28px;color:var(--ac)}
.qb i .ic{width:24px;height:24px;color:var(--ac)}.qb.on i .ic{color:#fff}
.go .ic,.qb.on .ic{color:inherit}
/* Typo « étiquette de pré-workout » : Anton pour les titres, boutons et onglets */
.card>b:first-child,.day h2,.tile b,.hht b,.brand span,.go,.qb,.tabs button,.rk .p,h1,h2,#nav button,.t,.cnt,.b{font-family:"Anton",Impact,"Arial Narrow",sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.04em}
.card>b:first-child{font-size:18px}.tile b{font-size:19px}.go{font-size:17px;letter-spacing:.06em}#nav button{letter-spacing:.06em;font-size:11.5px}.b{font-size:11px;font-weight:400}
.hht b,.brand span{font-size:24px;display:inline-block;transform:skewX(-8deg);letter-spacing:.06em}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin:0 0 14px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px 6px;border-radius:9px;font-family:"Anton",Impact,sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:14px;position:relative}
.seg button.on{background:var(--ac);color:#fff}.seg button.dotted::after{content:"";position:absolute;top:6px;right:10px;width:8px;height:8px;border-radius:50%;background:#e0245e}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 12px;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.find{position:relative;margin:0 0 14px}.find .ic.lead{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut);width:20px;height:20px}
.find input{padding:13px 14px 13px 44px;border-radius:14px;background:var(--card);font-size:16px}
.mgrp{margin:0 0 14px}.mgrp>b{display:block;font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.05em;font-size:15px;color:var(--mut);margin:0 0 8px}
.mitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:0 0 8px;color:var(--tx)}
.mitem>.ic:first-child{width:26px;height:26px;color:var(--ac)}.mitem div{flex:1;min-width:0}.mitem b{display:block;font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.04em;font-size:16px}
.mitem small{color:var(--mut);font-size:13.5px}.mitem>.ic:last-child{color:var(--mut);width:18px;height:18px}
.tour{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.tour .card{width:100%;max-width:520px;margin:0 0 env(safe-area-inset-bottom,0);padding:20px}
.tour h3{font-family:"Anton",Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.04em;font-size:22px;margin:6px 0 8px}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0 0}.dots span{width:8px;height:8px;border-radius:50%;background:var(--bd)}.dots span.on{background:var(--ac);width:20px;border-radius:99px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:45;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.sw{position:relative;width:48px;height:28px;flex:none;border-radius:99px;border:0;background:var(--bd);transition:background .2s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--ac)}.sw[aria-checked="true"]::after{transform:translateX(20px)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;color:var(--tx)}
.tile span{font-size:26px}.tile small{color:var(--mut);font-size:12px}
.ul{background:linear-gradient(var(--ac),var(--ac)) no-repeat 0 100%/0 2px;transition:background-size .3s ease;padding-bottom:1px}.tap .ul{background-size:100% 2px}.av.tap{animation:avp .35s ease-out}@keyframes avp{from{box-shadow:0 0 0 0 var(--ac)}to{box-shadow:0 0 0 7px transparent}}@media (prefers-reduced-motion:reduce){.ul{transition:none}.av.tap{animation:none}}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;background-size:cover;background-position:center;flex:none}
.sec{width:100%;margin-top:10px;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
h1{font-size:24px;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14.5px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
button{font:inherit;cursor:pointer}
.go{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600}
.day h2{font-size:15px;text-transform:capitalize;margin:0 0 8px;display:flex;justify-content:space-between}
.day h2 span{color:var(--mut);font-weight:400;font-size:13px;text-transform:none}
.s{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.s:first-of-type{border-top:0}
.t{font-weight:700;min-width:84px;font-variant-numeric:tabular-nums}
.p{flex:1;min-width:0;overflow-wrap:anywhere}
.b{background:var(--chip);color:var(--chiptx);border-radius:99px;padding:2px 9px;font-size:12px;white-space:nowrap}
.x{border:0;background:none;color:var(--mut);font-size:18px;padding:0 4px}
.note{color:var(--mut);font-size:14.5px;text-align:center}
.m{color:var(--mut);font-size:13.5px;margin-top:2px}
.s{flex-wrap:wrap}.p{flex:1 1 140px}
[hidden]{display:none!important}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabs button{flex:1 1 28%;padding:9px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.c{height:46px;min-width:0;overflow:hidden;border:1px solid var(--bd);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;background:var(--bg);padding:0;color:var(--tx)}
.c small{font-size:10px}.c.n{background:var(--chip);color:var(--ac);font-weight:700}.c.t{outline:2px solid var(--ac)}.c.sel{background:var(--ac);color:#fff}
.dh{text-align:center;color:var(--mut);font-size:12px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;text-transform:capitalize}
.nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 14px}
.medal{font-size:28px;min-width:34px;text-align:center}.rk{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}
.cm{font-size:15.5px;margin-top:6px;overflow-wrap:anywhere}
.tb{margin-top:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:99px;padding:4px 12px}.tb.on{background:var(--chip);border-color:var(--ac);color:var(--ac)}.cm button{margin-left:6px}
.cf{display:flex;gap:6px;margin-top:10px}.cf button{padding:0 14px;border:0;border-radius:10px;background:var(--ac);color:#fff}
</style>
</head>

<script>
const LABELS={pre:"⚡ Pré-workout",cafe:"☕ Café",energy:"🥤 Énergisant",autre:"✨ Énergisant"};
const $=s=>document.querySelector(s);
const useSB=typeof SB_URL==="string"&&SB_URL.startsWith("https://");
const hasFB=typeof FB_API_KEY==="string"&&FB_API_KEY.length>20&&!FB_API_KEY.startsWith("COLLE");
function uid(){try{let u=localStorage.getItem("bf_uid");if(!u){u="u"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("bf_uid",u)}return u}catch(e){return "u"+Math.random().toString(36).slice(2)}}
// Mode sécurisé (SB_SECURE=true dans config.js) : chaque requête envoie le jeton Firebase, vérifié par Supabase (voir supabase-securite.sql)
const SECURE=useSB&&typeof SB_SECURE!=="undefined"&&SB_SECURE===true;
let idTok=null,idExp=0,tokP=null;
function token(){
  if(!auth||!hasFB)return Promise.resolve(null);
  if(idTok&&Date.now()<idExp-60000)return Promise.resolve(idTok);
  return tokP=tokP||fetch("https://securetoken.googleapis.com/v1/token?key="+FB_API_KEY,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(auth.refresh)})
    .then(async r=>{if(r.status===400){auth=null;saveAuth();me=uid();idTok=null;render();renderAcct();return null}
      if(!r.ok)return null;const j=await r.json();idTok=j.id_token;idExp=Date.now()+(+j.expires_in||3600)*1000;
      if(j.refresh_token&&auth&&j.refresh_token!==auth.refresh){auth.refresh=j.refresh_token;saveAuth()}return idTok})
    .catch(()=>null).finally(()=>{tokP=null});
}
function sbDb(){
  const H={apikey:SB_KEY,"Content-Type":"application/json"};if(SB_KEY.startsWith("eyJ"))H.Authorization="Bearer "+SB_KEY;
  const enc=encodeURIComponent,cache={},subs={},sent={};
  const call=async(qs,method,body,extra)=>{
    const hd={...H,...extra};if(SECURE){const t=await token();if(t)hd.Authorization="Bearer "+t}
    const r=await fetch(SB_URL+"/rest/v1/docs"+qs,{method,headers:hd,body:body?JSON.stringify(body):undefined});
    if(!r.ok)throw new Error(r.status);
    const t=await r.text();return t?JSON.parse(t):null;
  };
  // Cache local (IndexedDB) : en rouvrant l'app, seuls les documents modifiés sont retéléchargés (photos comprises).
  // Les données privées (messages, mensurations, signalements) ne sont jamais gardées sur l'appareil.

function shrink(file){return new Promise((ok,ko)=>{
  const fr=new FileReader();
  fr.onerror=ko;
  fr.onload=()=>{
    const img=new Image();
    img.onerror=ko;
    img.onload=()=>{
      const s=Math.min(1,700/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      let q=0.75,d=c.toDataURL("image/jpeg",q);
      while(d.length>140000&&q>0.3){q-=0.1;d=c.toDataURL("image/jpeg",q)}
      d.length>200000?ko():ok(d);
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
})}

function prSeries(u,name){
  const k=(name||"").trim().toLowerCase(),own=x=>u?x.uid===u:(x.pseudo||"").trim().toLowerCase()===k,out={};
  LIFTS.forEach(([l])=>{
    let pts=prHist.filter(x=>own(x)&&x.lift===l&&x.kg>0).map(x=>({d:x.date,kg:x.kg}));
    const cur=prs.find(own);if(cur&&cur[l]&&!pts.some(p=>p.kg===cur[l]))pts.push({d:(cur.dates&&cur.dates[l])||todayStr(),kg:cur[l]});
    const by={};pts.forEach(p=>{by[p.d]=Math.max(by[p.d]||0,p.kg)});
    out[l]=Object.keys(by).sort().map(d=>({d,kg:by[d]}));
  });
  return out;
}
function sparkline(pts,label,unit){unit=unit||"kg";
  const W=300,H=90,P=10,box=h("div");box.style.marginTop="10px";

  hd.appendChild(h("b","",label));const dl=Math.round((last.kg-first.kg)*10)/10;hd.appendChild(h("span","m",last.kg+" "+unit+(pts.length>1&&dl?" ("+(dl>0?"+":"")+dl+")":"")));box.appendChild(hd);
  if(pts.length<2){box.appendChild(h("div","m","Une seule valeur pour l'instant : la courbe apparaîtra à la prochaine."));return box}
  const t=pts.map(p=>Date.parse(p.d)),t0=Math.min(...t),t1=Math.max(...t)||t0+1,v=pts.map(p=>p.kg),v0=Math.min(...v),v1=Math.max(...v);
  const X=i=>P+(t1===t0?0:(t[i]-t0)/(t1-t0))*(W-2*P),Y=i=>H-P-(v1===v0?.5:(v[i]-v0)/(v1-v0))*(H-2*P);
  const ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.style.cssText="width:100%;height:auto;display:block";
  svg.setAttribute("role","img");svg.setAttribute("aria-label",label+" : "+pts.map(p=>p.kg+" "+unit+" le "+p.d).join(", "));
  const base=document.createElementNS(ns,"line");base.setAttribute("x1",P);base.setAttribute("x2",W-P);base.setAttribute("y1",H-P+4);base.setAttribute("y2",H-P+4);base.setAttribute("stroke","var(--bd)");svg.appendChild(base);
  const pl=document.createElementNS(ns,"polyline");pl.setAttribute("points",pts.map((p,i)=>X(i)+","+Y(i)).join(" "));
  pl.setAttribute("fill","none");pl.setAttribute("stroke","var(--ac)");pl.setAttribute("stroke-width","2");pl.setAttribute("stroke-linejoin","round");svg.appendChild(pl);
  pts.forEach((p,i)=>{const c=document.createElementNS(ns,"circle");c.setAttribute("cx",X(i));c.setAttribute("cy",Y(i));c.setAttribute("r",i===pts.length-1?5:4);
    c.setAttribute("fill","var(--ac)");c.setAttribute("stroke","var(--card)");c.setAttribute("stroke-width","2");
    const tt=document.createElementNS(ns,"title");tt.textContent=p.kg+" "+unit+" · "+new Date(p.d+"T12:00:00").toLocaleDateString("fr-FR");c.appendChild(tt);svg.appendChild(c)});
  box.appendChild(svg);
  const ax=h("div","m");ax.style.cssText="display:flex;justify-content:space-between";
  [first,last].forEach(p=>ax.appendChild(h("span","",new Date(p.d+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"}))));box.appendChild(ax);
  return box;

let rest={end:0,dur:90,t:null};try{rest.dur=+localStorage.getItem("bf_rest")||90}catch(e){}
function mmss(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.25,a.currentTime+t);o.start(a.currentTime+t);o.stop(a.currentTime+t+.2)})}catch(e){}}
function tickRest(){
  const el=$("#restT"),left=(rest.end-Date.now())/1000;
  if(el)el.textContent=rest.end?mmss(left):mmss(rest.dur);
  if(rest.end&&left<=0){clearInterval(rest.t);rest.end=0;beep();try{navigator.vibrate&&navigator.vibrate([300,120,300])}catch(e){}
    if(document.hidden&&"Notification" in window&&Notification.permission==="granted")try{new Notification("Gym Crew",{body:"⏱️ Repos terminé, à toi !",icon:"icon-192.png"})}catch(e){}
    const b=$("#restB");if(b)rich(b,"▶️ Lancer");if(el)el.textContent="GO"}
}
function startRest(d){if(d)rest.dur=d;try{localStorage.setItem("bf_rest",rest.dur)}catch(e){}clearInterval(rest.t);rest.end=Date.now()+rest.dur*1000;rest.t=setInterval(tickRest,250);tickRest();const b=$("#restB");if(b)rich(b,"⏹️ Stop")}

// ---------- 🧮 Calcul du 1RM (onglet PR) ----------
function oneRmCard(){
  const c=h("div","card");c.appendChild(h("b","","🧮 Calculer mon 1RM"));
  const r=h("div","row"),a=h("div"),b=h("div");
  const kg=h("input");kg.type="number";kg.inputMode="decimal";kg.placeholder="Charge (kg)";
  const rp=h("input");rp.type="number";rp.inputMode="numeric";rp.placeholder="Répétitions";
  a.appendChild(kg);b.appendChild(rp);r.append(a,b);r.style.marginTop="10px";c.appendChild(r);
  const out=h("p","cm","Entre une série pour estimer ton max sur 1 répétition.");c.appendChild(out);
  const calc=()=>{const w=num(kg.value),n=Math.round(num(rp.value));
    if(!(w>0&&n>0)){out.textContent="Entre une série pour estimer ton max sur 1 répétition.";return}
    if(n>12){out.textContent="Au-delà de 12 répétitions l'estimation n'est pas fiable.";return}
    const rm=n===1?w:w*(1+n/30);
    out.textContent="1RM estimé : "+Math.round(rm*2)/2+" kg · 90 % = "+Math.round(rm*.9*2)/2+" kg · 80 % = "+Math.round(rm*.8*2)/2+" kg"};
  kg.oninput=rp.oninput=calc;return c;
}

// Demande : friend_req (id = de_à, appartient à l'expéditeur). Réponse : friend_ok (même id, appartient au destinataire, ok:true/false).
function frId(a,b){return a+"_"+b}
// Réponse valable seulement si elle est plus récente que la demande (on peut redemander après un refus)
function frAns(r){return fok.find(o=>o.id===r.id&&o.uid===r.to&&(o.reqTs!=null?o.reqTs===r.ts:o.ts>=r.ts))}
function frReq(u){return freq.find(r=>r.id===frId(u,auth.uid))}
function frState(u){
  if(!auth||!u||u===auth.uid)return "self";
  const me1=auth.uid,out=freq.find(r=>r.id===frId(me1,u)),inc=freq.find(r=>r.id===frId(u,me1));
  const okOut=out&&frAns(out),okIn=inc&&frAns(inc);
  if((out&&okOut&&okOut.ok)||(inc&&okIn&&okIn.ok))return "friend";
  if(inc&&!okIn)return "incoming";
  if(out&&!okOut)return "sent";
  return "none";
}
function friendIds(u){u=u||(auth&&auth.uid);if(!u)return[];const L=new Set();
  freq.forEach(r=>{const o=frAns(r);if(!o||!o.ok)return;if(r.from===u)L.add(r.to);if(r.to===u)L.add(r.from)});return[...L]}
function isFriend(u){return friendIds().includes(u)}
function frErr(e){const c=String(e&&e.message);return c==="401"||c==="403"?"La base a refusé l'action (droits Supabase). Vérifie que le dernier script de sécurité a bien été exécuté dans Supabase.":"Action impossible, réessaie."}

async function frAction(u,name){
  if(!auth){setView("acct");return}const no=cantPost();if(no){alert(no);return}
  const me1=auth.uid,st=frState(u),mn=clean(myName());
  try{
    if(st==="none"){await frCol.doc(frId(me1,u)).set({uid:me1,from:me1,to:u,fromName:mn,toName:name||"",ts:Date.now()})}
    else if(st==="sent"){await frCol.doc(frId(me1,u)).delete()}
    else if(st==="incoming"){await foCol.doc(frId(u,me1)).set({uid:me1,ok:true,reqTs:frReq(u).ts,ts:Date.now()})}
    else if(st==="friend"){if(!confirm("Retirer "+name+" de tes amis ?"))return;
      if(freq.some(r=>r.id===frId(me1,u)))await frCol.doc(frId(me1,u)).delete();
      if(frReq(u))await foCol.doc(frId(u,me1)).set({uid:me1,ok:false,reqTs:frReq(u).ts,ts:Date.now()})}
  }catch(e){alert(frErr(e))}

}

// Les positions des salles sont enregistrées une fois par un membre présent sur place (collection gym_geo) et servent à tous.

  if(!geoOn()||local||!ckCol)return;

  if(acc>500)return; // position trop imprécise
  const u=myId(),mine=checkins.find(c=>c.uid===u&&here(c)),near=nearestGym(la,lo);
  if(!mine&&near&&near.d<=GEO_IN+Math.min(acc,150)){
    if(cantPost())return;const ps=myName();if(ps==="Anonyme")return;
    try{await ckCol.doc(u).set({uid:u,pseudo:clean(ps),club:near.n,auto:true,ts:Date.now()});ckLogCol.add({uid:u,club:near.n,ts:Date.now()}).catch(()=>{});toast("📍 Check-in automatique : "+near.n)}catch(e){}

    const d=dist(la,lo,g.lat,g.lng);
    if(d>GEO_OUT+Math.min(acc,150)){if(++geoOutN>=2){geoOutN=0;try{await ckCol.doc(u).delete();toast("👋 Tu as quitté "+mine.club+" : check-out automatique")}catch(e){}}}else geoOutN=0}

// Positions des salles enregistrées automatiquement : l'app cherche l'adresse de chaque salle sur OpenStreetMap
// (service gratuit, on n'envoie que l'adresse de la salle) et la partage avec toute la team. L'appareil de l'admin
// s'occupe de toute la liste ; chaque membre complète au besoin les salles qu'il a choisies (dont « Autre salle »).
const COMMUNE_FULL={"Bruxelles":"1000 Bruxelles","Saint-Josse":"Saint-Josse-ten-Noode","Molenbeek":"Molenbeek-Saint-Jean","Saint-Gilles":"Saint-Gilles, Bruxelles"};
let geocoding=false,ggLoaded=false;
function addrQuery(e){const [com,name,adr]=e;const a=adr.replace(/\s*\(.*?\)\s*/g," ").trim();return /\d{4}/.test(a)?a+", Belgique":a+", "+(COMMUNE_FULL[com]||com)+", Belgique"}
async function nomi(q){const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=be&q="+encodeURIComponent(q),{headers:{"Accept-Language":"fr"}});if(!r.ok)throw new Error(r.status);const j=await r.json();return j[0]?{lat:+(+j[0].lat).toFixed(6),lng:+(+j[0].lon).toFixed(6)}:null}
const geoTried={}; // salle -> heure du dernier essai raté (on réessaie après 10 min)
function addrVariants(e){
  const [com,name,adr]=e,city=(COMMUNE_FULL[com]||com)+", Belgique",base=adr.replace(/\s*\(.*?\)\s*/g," ").trim();
  const [street,...rest]=base.split(","),tail=rest.join(",").trim(),loc=tail?tail+", Belgique":city;
  const num=street.match(/^(.*?)\s+(\d+)[\w\-\/]*\s*$/); // « Ikaroslaan 9-11 » -> « Ikaroslaan 9 »
  const V=[base+(tail?", Belgique":", "+city)];
  if(num){V.push(num[1]+" "+num[2]+", "+loc);V.push(num[1]+", "+loc)} // sans numéro : au moins la bonne rue
  V.push("Basic-Fit "+name.replace(/\s*24\/7/,"")+", Belgique");
  return [...new Set(V)];
}
async function geocodeOne(n){
  const e=BF_BXL.find(x=>gymKey(x[1])===gymKey(n));
  for(const q of e?addrVariants(e):["Basic-Fit "+n+", Belgique"]){
    const g=await nomi(q);await new Promise(r=>setTimeout(r,1200)); // 1 requête par seconde maximum (règle d'OpenStreetMap)
    if(g)return g}
  return null;
}
let geoPrio=[];
async function autoGeocode(){
  if(geocoding||local||!ggCol||!ggLoaded||!auth||cantPost())return;
  geocoding=true;let fails=0;if(!$("#acctTheme").hidden)renderTheme();
  // À chaque tour on recalcule la file : salles remises à zéro, puis mes salles, puis (admin) toute la liste
  for(;;){
    const want=[...new Set(geoPrio.concat(myGyms(),isAdmin()?BF_BXL.map(x=>x[1]):[]))];
    const n=want.find(x=>!geoOf(x)&&!(Date.now()-(geoTried[gymKey(x)]||0)<600e3));if(!n)break;
    geoPrio=geoPrio.filter(x=>x!==n);
    try{const g=await geocodeOne(n);
      if(g&&!geoOf(n))await ggCol.doc(gymKey(n)).set({uid:me,pseudo:"Position automatique",name:n,lat:g.lat,lng:g.lng,src:"auto",ts:Date.now()});
      else if(!g)geoTried[gymKey(n)]=Date.now();
      if(!$("#acctTheme").hidden)renderTheme()}
    catch(x){geoTried[gymKey(n)]=Date.now();if(++fails>=3)break}
  }
  geocoding=false;if(!$("#acctTheme").hidden)renderTheme();
}
async function resetGymPos(n){
  const g=geoOf(n);if(!g)return;if(!confirm("Effacer la position de "+n+" et la rechercher automatiquement ?"))return;
  try{geoPrio.unshift(n);await ggCol.doc(g.id).delete();delete geoTried[gymKey(n)];toast("Recherche de la position de "+n+"…");setTimeout(autoGeocode,300)}catch(e){alert("Action impossible.")}
}

// Panel admin : visible seulement pour le compte dont l'email correspond à ADMIN_HASH (config.js)
async function checkAdmin(){
  let ok=false;
  try{const hs=typeof ADMIN_HASH==="string"?[ADMIN_HASH]:(Array.isArray(ADMIN_HASH)?ADMIN_HASH:[]);
    if(auth&&auth.email&&hs.length){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(auth.email.trim().toLowerCase()));
      ok=hs.includes([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""))}}catch(e){}
  if(ok!==admin){admin=ok;render();renderHomeMenu();setTimeout(autoGeocode,1000);if(!$("#acct").hidden)renderAcct()}
  if(!admin&&curV==="admin")setView("home");
}
function isAdmin(){return admin&&!local}
async function delPhoto(p,ask){
  if(ask&&!confirm("Supprimer la photo de "+p.pseudo+" (et ses commentaires) ?"))return;
  try{await phCol.doc(p.id).delete()}catch(e){alert("Suppression impossible.");return}
  for(const c of comments.filter(c=>c.photoId===p.id))await cmCol.doc(c.id).delete().catch(()=>{});
  for(const r of reacts.filter(r=>r.photoId===p.id))await reCol.doc(r.id).delete().catch(()=>{});
}
function renderAdmin(){
  const box=$("#admin");box.textContent="";
  if(!isAdmin()){box.appendChild(h("p","note","Accès réservé à l'administrateur."));return}
  const fmt=t=>t?new Date(t).toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}):"";
  const del=(label,fn)=>{const b=h("button","x","🗑️");b.title="Supprimer";b.onclick=async()=>{if(!confirm(label))return;try{await fn()}catch(e){alert("Suppression impossible.")}};return b};
  const head=h("div","card");head.appendChild(h("b","","🛡️ Panel admin"));
  head.appendChild(h("p","m","Modère les publications de tout le monde. Les suppressions sont définitives. 🚫 = bannir, ✅ = lever le bannissement."));
  if(!SECURE)head.appendChild(h("p","m","⚠️ Mode sécurisé désactivé : la base reste modifiable par n'importe qui (voir README)."));
  const q=h("input");q.placeholder="Filtrer par pseudo ou texte…";q.value=adQ;
  q.oninput=()=>{adQ=q.value;const c=q.selectionStart;renderAdmin();const n=$("#admin input");n.focus();n.setSelectionRange(c,c)};
  head.appendChild(q);box.appendChild(head);
  const tabs=[["reports","🚩 Signalements",new Set(reports.map(r=>r.target)).size],["photos","📸 Photos",photos.length],["comments","💬 Commentaires",comments.length],["sessions","📋 Séances",rows.length],["prs","🏋️ PR",prs.length],["programs","📚 Programmes",programs.length],["rides","🚗 Covoit",rides.length],["profiles","👤 Profils",Object.keys(profiles).length]];
  const tg=h("div","tabs");
  tabs.forEach(([k,l,n])=>{const b=h("button",adTab===k?"on":"",l+" ("+n+")");b.onclick=()=>{adTab=k;renderAdmin()};tg.appendChild(b)});
  box.appendChild(tg);
  const card=h("div","card");box.appendChild(card);
  const f=adQ.trim().toLowerCase(),hit=(...v)=>!f||v.some(x=>String(x||"").toLowerCase().includes(f));
  const line=(u,name,txt,meta)=>{const s=h("div","s");s.appendChild(click(av(u,name),u,name));const p=h("div","p");p.appendChild(h("div","",txt));if(meta)p.appendChild(h("div","m",meta));s.appendChild(p);card.appendChild(s);return s};
  let n=0;
  if(adTab==="reports"){
    const g={};reports.forEach(r=>(g[r.target]=g[r.target]||[]).push(r));
    Object.values(g).sort((a,b)=>Math.max(...b.map(x=>x.ts))-Math.max(...a.map(x=>x.ts))).filter(L=>hit(L[0].author,L[0].text,...L.map(x=>x.why))).forEach(L=>{n++;
      const r0=L[0],ph=r0.type==="photo"?photos.find(p=>p.id===r0.target):null,cm=r0.type==="comment"?comments.find(c=>c.id===r0.target):null,gone=!ph&&!cm;
      const s=line(r0.authorUid,r0.author,(r0.type==="photo"?"📸 Photo de ":"💬 Commentaire de ")+r0.author+(r0.text?" : « "+r0.text+" »":""),
        L.length+" signalement"+(L.length>1?"s":"")+" · "+L.map(x=>x.by+(x.why?" (« "+x.why+" »)":"")).join(", ")+(gone?" · déjà supprimé":""));
      if(ph&&typeof ph.img==="string"&&ph.img.startsWith("data:image/")){const im=h("img");im.loading="lazy";im.decoding="async";im.src=ph.img;im.alt="Photo signalée";im.style.cssText="width:56px;height:56px;object-fit:cover;border-radius:8px";s.insertBefore(im,s.lastChild)}
      const clear=()=>Promise.all(L.map(x=>repCol.doc(x.id).delete()));
      const ok=h("button","x","✓");ok.title="Ignorer (le contenu reste)";ok.onclick=async()=>{try{await clear()}catch(e){alert("Action impossible.")}};s.appendChild(ok);
      if(!gone)s.appendChild(del("Supprimer ce contenu de "+r0.author+" ?",async()=>{if(ph)await delPhoto(ph,false);else await cmCol.doc(cm.id).delete();await clear()}));
      else s.appendChild(del("Effacer ces signalements ?",clear));
      const bb=banBtn(r0.authorUid,r0.author);if(bb)s.appendChild(bb)});
  }
  if(adTab==="photos")photos.slice().sort((a,b)=>b.ts-a.ts).filter(p=>hit(p.pseudo,p.note)).forEach(p=>{n++;
    const s=line(p.uid,p.pseudo,p.pseudo+(p.note?" · « "+p.note+" »":""),fmt(p.ts)+" · "+comments.filter(c=>c.photoId===p.id).length+" commentaire(s)");
    if(typeof p.img==="string"&&p.img.startsWith("data:image/")){const im=h("img");im.loading="lazy";im.decoding="async";im.src=p.img;im.alt="Photo de "+p.pseudo;im.style.cssText="width:56px;height:56px;object-fit:cover;border-radius:8px";s.insertBefore(im,s.lastChild)}
    const x=h("button","x","🗑️");x.title="Supprimer";x.onclick=()=>delPhoto(p,true);s.appendChild(x);const bb=banBtn(p.uid,p.pseudo);if(bb)s.appendChild(bb)});
  if(adTab==="comments")comments.slice().sort((a,b)=>b.ts-a.ts).filter(c=>hit(c.pseudo,c.text)).forEach(c=>{n++;
    const ph=photos.find(p=>p.id===c.photoId);
    line(c.uid,c.pseudo,c.pseudo+" : "+c.text,fmt(c.ts)+(ph?" · sur la photo de "+ph.pseudo:" · photo supprimée"))
      .append(del("Supprimer ce commentaire de "+c.pseudo+" ?",()=>cmCol.doc(c.id).delete()),banBtn(c.uid,c.pseudo)||"")});
  if(adTab==="sessions")rows.slice().sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start)).filter(r=>hit(r.pseudo,r.note,r.club,r.type)).forEach(r=>{n++;
    line(r.uid,r.pseudo,r.pseudo+" · "+new Date(r.date+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+" "+r.start+(r.type?" · "+r.type:""),[r.club&&"📍 "+r.club,r.note&&"« "+r.note+" »"].filter(Boolean).join(" · "))
      .append(del("Supprimer la séance de "+r.pseudo+" ?",()=>col.doc(r.id).delete()),banBtn(r.uid,r.pseudo)||"")});
  if(adTab==="rides")rides.slice().sort((a,b)=>b.ts-a.ts).filter(x=>hit(x.pseudo,x.from,x.to,x.note)).forEach(x=>{n++;
    const s=line(x.uid,x.pseudo,(x.type==="offer"?"🚗 Propose · ":"🙋 Cherche · ")+x.pseudo+" · "+fmtD(x.date)+(x.time?" "+x.time:""),x.from+" → "+x.to+(x.note?" · « "+x.note+" »":""));
    s.appendChild(del("Supprimer ce trajet de "+x.pseudo+" ?",async()=>{await rdCol.doc(x.id).delete();for(const j of rideTaken(x))await rjCol.doc(j.id).delete().catch(()=>{})}));
    const bb=banBtn(x.uid,x.pseudo);if(bb)s.appendChild(bb)});
  if(adTab==="programs")programs.slice().sort((a,b)=>b.ts-a.ts).filter(p=>hit(p.pseudo,p.name,...p.days.map(d=>d.name),...p.days.flatMap(d=>d.ex.map(e=>e.name)))).forEach(p=>{n++;
    const s=line(p.uid,p.pseudo,"📚 "+p.name+" · par "+p.pseudo,p.days.map(d=>d.name+" ("+d.ex.length+" exo"+(d.ex.length>1?"s":"")+")").join(" · ")+" · "+fmt(p.ts));
    const ds=h("details");ds.style.cssText="flex-basis:100%;font-size:13px;color:var(--mut)";ds.appendChild(h("summary","","Voir le contenu"));
    p.days.forEach(d=>ds.appendChild(h("div","",d.name+" : "+d.ex.map(e=>e.name+" "+e.sets+"×"+e.reps).join(", "))));
    s.appendChild(del("Supprimer le programme « "+p.name+" » de "+p.pseudo+" ?",()=>pgCol.doc(p.id).delete()));
    const bb=banBtn(p.uid,p.pseudo);if(bb)s.appendChild(bb);s.appendChild(ds)});
  if(adTab==="prs")prs.filter(p=>hit(p.pseudo)).forEach(p=>{n++;
    line(p.uid||p.id,p.pseudo,p.pseudo,LIFTS.map(([k,nm])=>nm+" "+(p[k]?p[k]+" kg":"–")).join(" · "))
      .appendChild(del("Supprimer les PR de "+p.pseudo+" ?",()=>prCol.doc(p.id).delete()))});
  if(adTab==="profiles")Object.keys(profiles).map(id=>({id,...profiles[id]})).filter(p=>hit(p.pseudo)).forEach(p=>{n++;
    const s=line(p.id,p.pseudo,(banned(p.id)?"🚫 ":"")+(p.pseudo||"Sans pseudo"),rows.filter(r=>r.uid===p.id).length+" séance(s) · "+photos.filter(x=>x.uid===p.id).length+" photo(s)");
    if(p.photo){const b=h("button","x","🖼️");b.title="Retirer la photo de profil";b.onclick=async()=>{if(!confirm("Retirer la photo de profil de "+p.pseudo+" ?"))return;try{const o={...profiles[p.id]};await profCol.doc(p.id).set({...o,uid:p.uid||p.id,pseudo:p.pseudo||"",photo:""})}catch(e){alert("Action impossible.")}};s.appendChild(b)}
    const bb=banBtn(p.id,p.pseudo);if(bb)s.appendChild(bb);
    s.appendChild(del("Supprimer le profil de "+p.pseudo+" ? (ses séances et photos restent, à supprimer dans les autres onglets)",()=>profCol.doc(p.id).delete()))});
  if(!n)card.appendChild(h("p","note",f?"Aucun résultat.":"Rien à modérer ici."));
}

async function remove(id){

  if(local){rows=rows.filter(r=>r.id!==id);render();return}
  try{await col.doc(id).delete()}catch(e){$("#status").textContent="Suppression impossible."}
}

$("#add").onclick=async()=>{
  const pseudo=$("#pseudo").value.trim(),date=$("#date").value,start=$("#start").value;
  if(!pseudo||!date||!start){$("#status").textContent="Pseudo, jour et heure d'arrivée sont requis.";return}
  const no=cantPost();if(no){$("#status").textContent=no;return}
  try{localStorage.setItem("bf_pseudo",pseudo);localStorage.setItem("bf_club",$("#club").value.trim())}catch(e){}
  const data={pseudo:clean(pseudo),date,start,end:$("#end").value||"",boost:$("#boost").value,type:$("#type").value,club:clean($("#club").value.trim()),note:clean($("#note").value.trim()),spot:$("#spot").checked,uid:me,ts:Date.now()};
  if(local){rows.push({id:"l"+Date.now(),...data});render();return}
  const n=+$("#rep").value||1;
  try{for(let i=0;i<n;i++){const d=new Date(date+"T12:00:00");d.setDate(d.getDate()+7*i);await col.add({...data,date:d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())})}$("#status").textContent=n>1?"Ajouté pour "+n+" semaines":"Ajouté"}
  catch(e){$("#status").textContent="Échec de l'envoi, réessaie."}
};

(async()=>{
  setTimeout(geoStart,2500);
  renderHomeMenu();pageTitle(curV);
  try{if(!localStorage.getItem("bf_tour"))setTimeout(()=>{if(!document.querySelector(".tour"))tour(0)},700)}catch(e){}
  render();
  let db=null;
  if(useSB){db=sbDb();me=(auth&&auth.uid)||uid()}else try{db=window.claude&&await claude.use("db")}catch(e){}
  if(!db){local=true;$("#status").textContent="Mode local : la base de données n'est pas configurée (voir README).";return}
  try{const u=await claude.use("user");if(u)me=await u.id()}catch(e){}
  col=db.collection("sessions");
  prCol=db.collection("prs");phCol=db.collection("photos");cmCol=db.collection("comments");
  prCol.onSnapshot(s=>{prs=s.docs.map(d=>({id:d.id,...d.data()}));renderPR()},()=>{});
  phCol.onSnapshot(s=>{photos=s.docs.map(d=>({id:d.id,...d.data()}));renderPhotos()},()=>{});
  cmCol.onSnapshot(s=>{comments=s.docs.map(d=>({id:d.id,...d.data()}));renderPhotos()},()=>{});
  profCol=db.collection("profiles");
  profCol.onSnapshot(s=>{profiles={};s.docs.forEach(d=>{profiles[d.id]=d.data()});
    const mp=auth&&profiles[auth.uid];if(mp&&mp.pseudo&&!pa){pa=true;applyProfile(mp.pseudo)}
    renderHome();renderList();renderPhotos();if(!$("#user").hidden)renderUser();if(auth&&!$("#acct").hidden)renderAcct()},()=>{});
  DB=db;folCol=db.collection("follows");
  folCol.onSnapshot(s=>{follows=s.docs.map(d=>({id:d.id,...d.data()}));renderList();renderPhotos();if(!$("#user").hidden)renderUser();if(auth&&!$("#acct").hidden)renderAcct()},()=>{});
  subInbox();
  banCol=db.collection("bans");banCol.onSnapshot(s=>{bans=s.docs.map(d=>({id:d.id,...d.data()}));render();badge()},()=>{});
  repCol=db.collection("reports");repCol.onSnapshot(s=>{reports=s.docs.map(d=>({id:d.id,...d.data()}));badge();if(!$("#admin").hidden)renderAdmin()},()=>{});
  ckCol=db.collection("checkins");ckCol.onSnapshot(s=>{checkins=s.docs.map(d=>({id:d.id,...d.data()}));renderHome()},()=>{});
  const sub=(name,set,views)=>{const c=db.collection(name);c.onSnapshot(s=>{set(s.docs.map(d=>({id:d.id,...d.data()})));views.forEach(soft);renderHome();if(!$("#user").hidden)renderUser();if(!$("#notifs").hidden)renderNotifs()},()=>{});return c};
  frCol=sub("friend_req",v=>{freq=v;frBadge()},["friends"]);foCol=sub("friend_ok",v=>{fok=v;frBadge()},["friends"]);
  woCol=sub("workouts",v=>workouts=v,["journal","defis"]);pgCol=sub("programs",v=>{programs=v;if(!$("#admin").hidden)renderAdmin()},["programs"]);
  ggCol=sub("gym_geo",v=>{gymGeo=v;const first=!ggLoaded;ggLoaded=true;setTimeout(autoGeocode,first?3000:800);if(!$("#acctTheme").hidden)renderTheme()},[]);
  rdCol=sub("rides",v=>{rides=v;if(!$("#admin").hidden)renderAdmin()},["rides"]);rjCol=sub("ride_join",v=>rideJ=v,["rides"]);
  lfgCol=sub("lfg",v=>lfg=v,["team"]);ljCol=sub("lfg_join",v=>lfgJ=v,["team"]);grCol=sub("groups",v=>groups=v,["team"]);gmCol=sub("gmember",v=>gmem=v,["team"]);
  duCol=sub("duels",v=>duels=v,["defis"]);drCol=sub("duel_resp",v=>duelR=v,["defis"]);ckLogCol=sub("ck_log",v=>ckLog=v,["crowd","defis"]);bdCol=sub("body",v=>body=v,["body"]);
  histCol=db.collection("pr_history");histCol.onSnapshot(s=>{prHist=s.docs.map(d=>({id:d.id,...d.data()}));renderPR();if(!$("#user").hidden)renderUser()},()=>{});
  reCol=db.collection("reactions");reCol.onSnapshot(s=>{reacts=s.docs.map(d=>({id:d.id,...d.data()}));renderPhotos()},()=>{});
  col.onSnapshot(snap=>{rows=snap.docs.map(d=>({id:d.id,...d.data()}));render()},
    ()=>{$("#status").textContent="Connexion au planning perdue."});
})();
